name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk givebackmyOneplus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: givebackmyOneplus-apk
          path: givebackmyOneplus.apk
      # Постоянная прямая ссылка: releases/download/latest/givebackmyOneplus.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: givebackmyOneplus build 20
          prerelease: false
          files: givebackmyOneplus.apk
          body: |
            ## givebackmyOneplus — build 20

            Фишки OnePlus и очистка от рекламы для Xiaomi / Redmi / POCO на HyperOS. Без root.

            **Функции:** Alert Slider, Live Alerts, Horizon Light, анимация зарядки (3 стиля),
            Zen Mode, режим чтения (ч/б), игровой режим, Shelf (полка), виджет часов OnePlus-стиля.
            **Очистка:** удаление рекламы и лишних приложений Xiaomi через Shizuku.
            **Тема:** перекраска иконок в предпросмотре (применение на столе — после root).

            Неофициальный проект, не связан с OnePlus и Xiaomi.

            _Прямая ссылка на APK:_ releases/download/latest/givebackmyOneplus.apk
